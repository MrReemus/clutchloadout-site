<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clutch Loadout | Coming Soon</title>
  <meta name="description" content="Clutch Loadout is an e-commerce brand based in the UAE. Launching soon.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='21.5' font-family='Arial,sans-serif' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3ECL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #fafaf9;
      --text: #111111;
      --muted: #6b6b6b;
      --line: #e4e4e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e0e;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --line: #2a2a2a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 0 24px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }
    .label {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 24px;
    }
    .tagline {
      font-size: 18px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 40px;
    }
    .rule {
      width: 40px;
      height: 1px;
      background: var(--line);
      margin-bottom: 32px;
    }
    .contact {
      font-size: 15px;
      color: var(--muted);
    }
    .contact a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
    }
    .contact a:hover { border-color: var(--text); }
    footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">Coming soon</p>
    <h1>Clutch Loadout</h1>
    <p class="tagline">Gear for the moments that matter.<br>An online store based in the UAE, launching soon.</p>
    <div class="rule"></div>
    <p class="contact">Get in touch: <a href="mailto:Mr.Reemus@clutchloadout.com">Mr.Reemus@clutchloadout.com</a></p>
  </main>
  <footer>&copy; 2026 Clutch Loadout. Dubai, United Arab Emirates.</footer>
</body>
</html>
